<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250">
  <rect x="0" y="0" width="840" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="420" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">
    India's AI &amp; Neurotechnology Ecosystem Overview
  </text>

  <!-- Column 1 -->
  <rect x="24" y="54" width="250" height="172" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="24" y="54" width="250" height="34" rx="8" fill="#0284c7"/>
  <text x="149" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Research Institutions</text>
  <text x="38" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• IISc Bengaluru</text>
  <text x="48" y="128" font-family="Arial, sans-serif" font-size="11" fill="#334155">AI Brain Co-Processor &amp; rehab</text>
  <text x="38" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• IIT Delhi &amp; IIT Kanpur</text>
  <text x="48" y="170" font-family="Arial, sans-serif" font-size="11" fill="#334155">Wearable fNIRS-EEG &amp; robotics</text>
  <text x="38" y="194" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• NBRC</text>
  <text x="48" y="212" font-family="Arial, sans-serif" font-size="11" fill="#334155">Computational brain mapping</text>

  <!-- Column 2 -->
  <rect x="295" y="54" width="250" height="172" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="295" y="54" width="250" height="34" rx="8" fill="#1d4ed8"/>
  <text x="420" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Startups &amp; Public Backing</text>
  <text x="309" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• BrainSightAI</text>
  <text x="319" y="128" font-family="Arial, sans-serif" font-size="11" fill="#334155">AI connectomics for surgery</text>
  <text x="309" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• DST, ANRF/SERB &amp; IndiaAI</text>
  <text x="319" y="170" font-family="Arial, sans-serif" font-size="11" fill="#334155">Med-tech grants &amp; compute</text>
  <text x="309" y="194" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• Clinical Focus</text>
  <text x="319" y="212" font-family="Arial, sans-serif" font-size="11" fill="#334155">Stroke recovery &amp; accessibility</text>

  <!-- Column 3 -->
  <rect x="566" y="54" width="250" height="172" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="566" y="54" width="250" height="34" rx="8" fill="#0f766e"/>
  <text x="691" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Ethics &amp; Scale-Up</text>
  <text x="580" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• Affordability &amp; Reach</text>
  <text x="590" y="128" font-family="Arial, sans-serif" font-size="11" fill="#334155">Low-cost non-invasive tools</text>
  <text x="580" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• Regulation &amp; Safety</text>
  <text x="590" y="170" font-family="Arial, sans-serif" font-size="11" fill="#334155">CDSCO pathways &amp; clinical trials</text>
  <text x="580" y="194" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">• Neural Data Privacy</text>
  <text x="590" y="212" font-family="Arial, sans-serif" font-size="11" fill="#334155">Consent &amp; brainwave security</text>
