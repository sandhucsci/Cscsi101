<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260">
  <rect width="820" height="260" fill="#f8fafc" rx="12"/>
  <text x="410" y="32" font-family="Arial" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Original Diagram 1: How an AI-Driven Brain-Computer Interface (BCI) Works
  </text>

  <!-- Step 1 -->
  <rect x="25" y="65" width="165" height="125" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="107" y="92" font-family="Arial" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. Signal Capture</text>
  <text x="107" y="116" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">EEG Cap (Non-Invasive)</text>
  <text x="107" y="135" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">ECoG (Surface Grid)</text>
  <text x="107" y="154" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Microelectrodes (Invasive)</text>
  <text x="107" y="176" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">Reads neuron spikes</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="127" x2="225" y2="127" stroke="#0f172a" stroke-width="3"/>
  <polygon points="225,121 237,127 225,133" fill="#0f172a"/>

  <!-- Step 2 -->
  <rect x="238" y="65" width="165" height="125" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="320" y="92" font-family="Arial" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">2. Noise Filtering</text>
  <text x="320" y="116" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Amplifies micro-volts</text>
  <text x="320" y="135" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Removes muscle/blink</text>
  <text x="320" y="154" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">interference artifacts</text>
  <text x="320" y="176" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">Clean digital wave</text>

  <!-- Arrow 2 -->
  <line x1="403" y1="127" x2="438" y2="127" stroke="#0f172a" stroke-width="3"/>
  <polygon points="438,121 450,127 438,133" fill="#0f172a"/>

  <!-- Step 3 -->
  <rect x="451" y="65" width="165" height="125" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="533" y="92" font-family="Arial" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">3. AI Decoding</text>
  <text x="533" y="116" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Neural Networks &amp; ML</text>
  <text x="533" y="135" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Learns user intent</text>
  <text x="533" y="154" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Adapts to signal drift</text>
  <text x="533" y="176" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">Translates thought</text>

  <!-- Arrow 3 -->
  <line x1="616" y1="127" x2="651" y2="127" stroke="#0f172a" stroke-width="3"/>
  <polygon points="651,121 663,127 651,133" fill="#0f172a"/>

  <!-- Step 4 -->
  <rect x="664" y="65" width="135" height="125" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="731" y="92" font-family="Arial" font-size="14" font-weight="bold" fill="#581c87" text-anchor="middle">4. Action Output</text>
  <text x="731" y="116" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Robotic Arm</text>
  <text x="731" y="135" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Speech Synthesizer</text>
  <text x="731" y="154" font-family="Arial" font-size="12" fill="#1e293b" text-anchor="middle">Cursor / Wheelchair</text>
  <text x="731" y="176" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">Closed-loop feedback</text>

  <!-- Closed loop return arrow -->
  <path d="M 731 190 L 731 228 L 107 228 L 107 195" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="101,197 107,187 113,197" fill="#0284c7"/>
  <text x="419" y="221" font-family="Arial" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">
    Sensory &amp; Visual Feedback Loop (Helps Brain &amp; AI Co-Adapt)
  </text>
</svg>