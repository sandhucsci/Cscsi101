<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230">
  <rect x="0" y="0" width="840" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="420" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">
    4-Stage Closed-Loop AI Brain-Computer Interface (BCI) Pipeline
  </text>

  <!-- Stage 1 -->
  <rect x="24" y="54" width="175" height="122" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="111" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">1. Signal Capture</text>
  <text x="111" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">EEG / fNIRS / ECoG</text>
  <text x="111" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">or Microelectrodes</text>
  <text x="111" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Records neural activity</text>

  <line x1="199" y1="115" x2="231" y2="115" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="231,109 243,115 231,121" fill="#0f172a"/>

  <!-- Stage 2 -->
  <rect x="243" y="54" width="175" height="122" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">2. Pre-Processing</text>
  <text x="330" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">Bandpass Filtering</text>
  <text x="330" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">&amp; Artifact Removal</text>
  <text x="330" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Cleans muscle &amp; line noise</text>

  <line x1="418" y1="115" x2="450" y2="115" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="450,109 462,115 450,121" fill="#0f172a"/>

  <!-- Stage 3 -->
  <rect x="462" y="54" width="175" height="122" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="549" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3730a3">3. AI Decoding</text>
  <text x="549" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">Deep Learning &amp;</text>
  <text x="549" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">Adaptive Calibration</text>
  <text x="549" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Maps patterns to intent</text>

  <line x1="637" y1="115" x2="669" y2="115" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="669,109 681,115 669,121" fill="#0f172a"/>

  <!-- Stage 4 -->
  <rect x="681" y="54" width="135" height="122" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="748" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">4. Output &amp; Loop</text>
  <text x="748" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">Speech, Prosthetics</text>
  <text x="748" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e293b">&amp; Sensory Feedback</text>
  <text x="748" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Closed-loop adaptation</text>

  <!-- Feedback Arrow -->
  <path d="M 748 176 L 748 202 L 111 202 L 111 182" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="106,184 111,176 116,184" fill="#0f766e"/>
  <text x="420" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f766e">
    Closed-Loop Sensory &amp; Neural Feedback
  </text>
</svg>
